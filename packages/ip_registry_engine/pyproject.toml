[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-registry-engine"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["ip-registry-contracts==0.2.0"]

[project.optional-dependencies]
local-ner = ["transformers>=5.17,<6", "torch>=2.14,<3", "safetensors>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]
